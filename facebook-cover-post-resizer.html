    <style>
        /* ============================================================
           DESIGN TOKENS
           ============================================================ */
        :root {
            --navy: #0b1a33; --navy-soft: #1e2a44;
            --text: #1f2a3d; --text-muted: #5b6b83; --text-subtle: #8494ab;
            --bg: #f8fafc; --bg-alt: #f1f5fb; --surface: #ffffff;
            --border: #e5ecf5; --border-strong: #d3dfed;
            --primary: #2563eb; --primary-dark: #1d4ed8; --primary-soft: #e8f0fe;
            --teal: #0d9488; --teal-soft: #ccfbf1;
            --danger: #dc2626; --danger-soft: #fef2f2;
            --success: #059669; --success-soft: #ecfdf5;
            --warning: #d97706; --warning-soft: #fffbeb;
            --gradient-brand: linear-gradient(135deg, #2563eb 0%, #0ea5e9 60%, #0d9488 100%);
            --gradient-navy: linear-gradient(135deg, #0b1a33 0%, #16304f 100%);
            --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-full: 999px;
            --shadow-xs: 0 1px 2px rgba(15,30,55,0.04);
            --shadow-sm: 0 2px 8px rgba(15,30,55,0.05), 0 1px 2px rgba(15,30,55,0.03);
            --shadow-md: 0 8px 24px -6px rgba(15,30,55,0.09), 0 2px 6px rgba(15,30,55,0.04);
            --shadow-lg: 0 24px 48px -12px rgba(15,30,55,0.16), 0 8px 16px -8px rgba(15,30,55,0.06);
            --shadow-brand: 0 8px 22px -6px rgba(37,99,235,0.35);
            --ease: cubic-bezier(0.22,0.61,0.36,1);
            --t-fast: 0.18s var(--ease);
            --t-med: 0.32s var(--ease);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--text); background: var(--bg); line-height: 1.65; font-size: 16px;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
            position: relative;
        }
        h1, h2, h3, h4 {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; color: var(--navy);
            line-height: 1.2; letter-spacing: -0.02em; font-weight: 700;
        }
        a { color: inherit; }
        img, svg { display: block; max-width: 100%; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); position: relative; z-index: 2; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 6px; }
        .icon {
            width: 1.25em; height: 1.25em; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round; fill: none;
            flex-shrink: 0; display: inline-block; vertical-align: middle;
        }

        /* ============================================================
           BACKGROUND ELEMENTS & ANIMATIONS
           ============================================================ */
        .bg-decoration {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .deco-shape {
            position: absolute; opacity: 0.4; animation: floatShape 15s ease-in-out infinite;
        }
        .deco-shape-1 { top: 10%; left: 5%; width: 120px; height: 120px; color: var(--primary-soft); animation-delay: 0s; }
        .deco-shape-2 { top: 40%; right: 5%; width: 80px; height: 80px; color: var(--teal-soft); animation-delay: -5s; }
        .deco-shape-3 { bottom: 15%; left: 10%; width: 60px; height: 60px; color: #fce7f3; animation-delay: -10s; }
        .deco-shape-4 { bottom: 30%; right: 15%; width: 100px; height: 100px; color: var(--primary-soft); animation-delay: -7s; }

        @keyframes floatShape {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(10deg) scale(1.05); }
        }

        .sparkle {
            position: absolute; width: 4px; height: 4px; background: var(--primary);
            border-radius: 50%; opacity: 0; box-shadow: 0 0 8px 1px rgba(37,99,235,0.6);
            animation: sparkleRise linear infinite;
        }
        @keyframes sparkleRise {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.1); opacity: 0; }
        }

        .reveal {
            opacity: 0; transform: translateY(24px);
            transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
            will-change: opacity, transform;
        }
        .reveal.is-visible { opacity: 1; transform: translateY(0); }

        /* ============================================================
           HEADER
           ============================================================ */
        .site-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255,255,255,0.82);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid rgba(229,236,245,0.9);
            transition: box-shadow var(--t-med), background var(--t-med);
        }
        .site-header.is-scrolled { box-shadow: var(--shadow-sm); background: rgba(255,255,255,0.94); }
        .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; padding: 0.85rem 0; }
        .brand { display: inline-flex; align-items: center; gap: 0.8rem; text-decoration: none; flex-shrink: 0; min-width: 0; }
        .brand-mark {
            width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
            background: var(--gradient-brand); color: #fff;
            box-shadow: 0 6px 16px -6px rgba(37,99,235,0.5);
            transition: transform var(--t-med); flex-shrink: 0;
        }
        .brand:hover .brand-mark { transform: rotate(-6deg) scale(1.04); }
        .brand-mark .icon { width: 24px; height: 24px; }
        .brand-text { display: flex; flex-direction: column; justify-content: center; line-height: 1.15; min-width: 0; }
        .brand-name {
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.25rem; font-weight: 800;
            color: var(--navy); letter-spacing: -0.03em; line-height: 1.1; white-space: nowrap;
        }
        .brand-tag { font-size: 0.72rem; font-weight: 500; color: var(--text-subtle); margin-top: 2px; white-space: nowrap; }

        .primary-nav { display: flex; align-items: center; min-width: 0; }
        .nav-list { display: flex; align-items: center; gap: 0.2rem; list-style: none; }
        .nav-link {
            display: inline-block; padding: 0.5rem 0.8rem; font-size: 0.9rem; font-weight: 500;
            color: var(--text); text-decoration: none; border-radius: var(--r-full);
            transition: color var(--t-fast), background var(--t-fast); white-space: nowrap;
        }
        .nav-link:hover { color: var(--primary-dark); background: var(--primary-soft); }
        .nav-link.is-active { color: var(--primary-dark); background: var(--primary-soft); }
        .nav-cta {
            display: inline-flex; align-items: center; gap: 0.45rem; margin-left: 0.4rem;
            padding: 0.6rem 1.1rem; font-size: 0.88rem; font-weight: 600; color: #fff;
            text-decoration: none; border-radius: var(--r-full);
            background: var(--gradient-navy); box-shadow: var(--shadow-sm);
            transition: transform var(--t-fast), box-shadow var(--t-fast); white-space: nowrap;
        }
        .nav-cta:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .nav-cta .icon { width: 16px; height: 16px; }
        .menu-toggle {
            display: none; width: 44px; height: 44px; border: 1px solid var(--border);
            border-radius: 12px; background: var(--surface); color: var(--navy);
            cursor: pointer; place-items: center;
            transition: background var(--t-fast), border-color var(--t-fast); flex-shrink: 0;
        }
        .menu-toggle:hover { background: var(--primary-soft); border-color: #bfd4f7; }
        .menu-toggle .icon { width: 22px; height: 22px; }

        /* ============================================================
           PAGE SHELL & TOOL UI
           ============================================================ */
        .page-main {
            flex: 1;
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5fb 100%);
            padding: clamp(7rem, 11vw, 9rem) 0 clamp(3rem, 6vw, 5rem);
        }
        .breadcrumb {
            display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem;
            font-size: 0.82rem; color: var(--text-subtle); margin-bottom: 1.25rem;
        }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--primary-dark); }
        .breadcrumb .sep { color: var(--text-subtle); }

        .page-head { margin-bottom: 1.75rem; max-width: 820px; }
        .page-head h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; margin-bottom: 0.6rem; }
        .page-head p { color: var(--text-muted); font-size: 1rem; line-height: 1.7; }
        .page-head .badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
        .badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.3rem 0.75rem; border-radius: var(--r-full);
            font-size: 0.78rem; font-weight: 600;
            background: var(--primary-soft); color: var(--primary-dark);
        }
        .badge.teal { background: var(--teal-soft); color: #0f766e; }

        .tool-layout {
            display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 1.75rem;
            align-items: start;
        }
        @media (max-width: 992px) {
            .tool-layout { grid-template-columns: 1fr; }
            .sidebar { order: 2; }
        }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--r-lg); box-shadow: var(--shadow-xs);
        }
        .tool-card {
            padding: 1.75rem; position: relative; overflow: hidden;
        }
        .tool-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--gradient-brand);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #d3dfed; border-radius: var(--r-md);
            padding: 3rem 1.5rem; text-align: center; cursor: pointer;
            background: #f8fafc;
            transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary); background: #f0f6ff; box-shadow: var(--shadow-sm);
        }
        .upload-icon-wrapper {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--primary-soft); color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem; transition: transform var(--t-med);
        }
        .upload-area:hover .upload-icon-wrapper { transform: scale(1.05); }
        .upload-icon-wrapper i { font-size: 2rem; }
        .upload-area h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--navy); }
        .upload-area p { color: var(--text-subtle); font-size: 0.95rem; margin-bottom: 0; }
        #file-input { display: none; }

        /* Editor Layout */
        .editor-layout {
            display: grid; grid-template-columns: 1fr; gap: 1.5rem;
        }
        @media (min-width: 768px) {
            .editor-layout { grid-template-columns: 1fr 300px; }
        }

        /* Image Preview Box */
        .image-preview-box {
            background: repeating-conic-gradient(#eef2f8 0% 25%, #f8fafc 0% 50%) 50% / 20px 20px;
            border: 1px solid var(--border-strong); border-radius: var(--r-md);
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; min-height: 320px; overflow: hidden;
            position: relative;
        }
        
        .preview-img-wrapper {
            box-shadow: var(--shadow-md);
            background: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 400px;
        }
        
        .preview-img-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 400px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md);
            padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem;
            overflow-y: auto; max-height: 500px;
        }
        
        .control-group h4 {
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-subtle); margin-bottom: 0.75rem; font-weight: 700;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .control-group h4 i { color: var(--primary); }

        .preset-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .preset-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.8rem;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: all var(--t-fast);
            font-family: inherit;
            text-align: left;
        }
        .preset-btn:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .preset-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }
        .preset-btn.active .preset-name { color: #fff; }
        .preset-btn.active .preset-size { color: rgba(255,255,255,0.8); }
        .preset-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--navy);
            line-height: 1.2;
        }
        .preset-size {
            font-size: 0.75rem;
            color: var(--text-subtle);
            margin-top: 0.15rem;
        }

        .fit-options {
            display: flex;
            gap: 0.5rem;
        }
        .fit-btn {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: all var(--t-fast);
            font-family: inherit;
            color: var(--text);
        }
        .fit-btn:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary-dark);
        }
        .fit-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        /* Action Bar */
        .action-bar {
            display: flex; flex-direction: column; gap: 0.5rem; margin-top: auto;
        }
        .btn-download {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.9rem 1.25rem; font-size: 0.95rem; font-weight: 600; border-radius: var(--r-md);
            border: none; cursor: pointer; color: #fff;
            background: var(--gradient-brand);
            box-shadow: var(--shadow-brand);
            transition: transform var(--t-fast), box-shadow var(--t-fast), opacity var(--t-fast);
        }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -8px rgba(37,99,235,0.45); }
        .btn-reset {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.7rem 1rem; font-size: 0.85rem; font-weight: 600; border-radius: var(--r-md);
            background: transparent; border: 1px solid var(--border-strong); color: var(--text-muted);
            cursor: pointer; transition: all var(--t-fast); font-family: inherit;
        }
        .btn-reset:hover { background: var(--border); color: var(--navy); }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 1.25rem; }
        .ad-space {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
            padding: 1.25rem; text-align: center; box-shadow: var(--shadow-xs);
        }
        .ad-label {
            font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.08em; margin-bottom: 0.6rem; background: var(--bg);
            padding: 0.25rem 0.7rem; border-radius: var(--r-full); display: inline-block; font-weight: 600;
        }
        .ad-example {
            width: 100%; height: 200px; background: var(--bg); border: 1px dashed var(--border-strong);
            border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center;
            color: var(--text-subtle); font-size: 0.82rem; font-weight: 500;
        }

        /* ============================================================
           CONTENT SECTIONS
           ============================================================ */
        .content-shell { margin-top: 3rem; display: flex; flex-direction: column; gap: 2rem; }

        .content-block {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: clamp(1.5rem, 3vw, 2.25rem);
            box-shadow: var(--shadow-xs);
            transition: box-shadow var(--t-med), border-color var(--t-med);
        }
        .content-block:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }

        .content-block::before {
            content: "";
            position: absolute; top: 0; left: clamp(1.5rem, 3vw, 2.25rem);
            width: 44px; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--teal));
            border-radius: 0 0 3px 3px;
            transition: width 0.4s var(--ease);
        }
        .content-block:hover::before { width: 72px; }

        .section-eyebrow {
            display: inline-flex; align-items: center; gap: 0.45rem;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--primary-dark);
            background: var(--primary-soft); padding: 0.3rem 0.7rem;
            border-radius: var(--r-full); margin-bottom: 0.85rem;
        }
        .section-eyebrow i { font-size: 0.75rem; }

        .content-block h2 {
            font-size: clamp(1.25rem, 2.4vw, 1.55rem);
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
        }
        .content-block h3 {
            font-size: 1rem; margin: 1.5rem 0 0.5rem;
            display: flex; align-items: center; gap: 0.5rem;
            color: var(--navy);
        }
        .content-block h3::before {
            content: ""; width: 6px; height: 6px; border-radius: 50%;
            background: var(--primary); flex-shrink: 0;
        }
        .content-block h3:first-of-type { margin-top: 0.5rem; }
        .content-block p {
            font-size: 0.95rem; color: var(--text-muted); line-height: 1.75;
            margin-bottom: 0.85rem;
        }
        .content-block p:last-child { margin-bottom: 0; }
        .content-block strong { color: var(--navy); font-weight: 600; }

        .step-list {
            list-style: none; counter-reset: step; padding: 0; margin: 1.25rem 0 0;
            display: grid; gap: 0.75rem;
        }
        .step-list li {
            counter-increment: step;
            position: relative;
            padding: 0.9rem 1rem 0.9rem 3.4rem;
            background: linear-gradient(180deg, #fbfdff 0%, var(--bg) 100%);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            font-size: 0.92rem; color: var(--text-muted); line-height: 1.65;
            transition: transform var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
        }
        .step-list li::before {
            content: counter(step);
            position: absolute; left: 0.9rem; top: 0.85rem;
            width: 30px; height: 30px; border-radius: 50%;
            display: grid; place-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem; font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--teal));
            box-shadow: 0 4px 10px -3px rgba(37,99,235,0.45);
        }
        .step-list li:hover {
            transform: translateY(-1px);
            border-color: #c7d8f2;
            box-shadow: var(--shadow-sm);
        }
        .step-list li strong { color: var(--navy); display: inline; }

        .bullet-list {
            list-style: none; padding: 0; margin: 0.75rem 0 0;
            display: grid; gap: 0.5rem;
        }
        .bullet-list li {
            position: relative;
            padding: 0.65rem 0.9rem 0.65rem 2.4rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            font-size: 0.92rem; color: var(--text-muted); line-height: 1.65;
            transition: border-color var(--t-fast), background var(--t-fast);
        }
        .bullet-list li::before {
            content: "";
            position: absolute; left: 1rem; top: 1.05rem;
            width: 8px; height: 8px; border-radius: 2px;
            background: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        .bullet-list li:hover { border-color: #c7d8f2; background: #fbfdff; }
        .bullet-list li strong { color: var(--navy); }

        .callout {
            display: flex; align-items: flex-start; gap: 0.8rem;
            padding: 1rem 1.1rem; margin-top: 1rem;
            background: var(--primary-soft);
